version: 2
updates:
  # Security and version updates for the pnpm workspace (all packages share one lockfile).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Version updates wait a week after a release (time for a compromised publish to be caught and pulled);
    # security updates are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    # The Node types follow the Node major the project runs on (.nvmrc, the Docker image); moving to a new Node
    # major is a deliberate upgrade, not a routine bump.
    ignore:
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # Keeps the SHA-pinned actions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ['*']
  # The Docker image's base is a floating tag (node:<major>-trixie-slim, no digest): every build pulls the newest
  # one, so patch and security releases need no pull request. Dependabot watches the tag in case it ever pins a
  # version again; a new Node major (and only an LTS one) is a deliberate upgrade together with .nvmrc and
  # @types/node, so majors are never proposed.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
  # Keeps the digest-pinned Postgres image in compose.yaml current. A new Postgres major cannot read an existing data
  # directory (it needs a dump and restore), so majors are never proposed automatically.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: postgres
        update-types: [version-update:semver-major]
