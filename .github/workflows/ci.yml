name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Dependency install scripts never run (see desktop.yml for why nothing needs them).
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Any known vulnerability in any dependency (prod or dev, shipped or build-time) fails the build.
      - run: pnpm audit
      - run: pnpm typecheck
      # Includes the desktop unit/security tests and the server suites re-run on the node:sqlite dialect.
      - run: pnpm test
      # `pnpm new:indicator` must keep producing an indicator that typechecks and passes its own and the catalog tests.
      - name: Indicator scaffold
        run: |
          pnpm new:indicator CiScaffoldCheck
          pnpm --filter @chartmate/web typecheck
          pnpm --filter @chartmate/web exec vitest run test/indicators
          rm apps/web/src/chart/indicators/custom/ciScaffoldCheck.ts apps/web/test/indicators/ciScaffoldCheck.test.ts
      - run: pnpm --filter @chartmate/web build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Developer Certificate of Origin: every commit of a pull request is signed off (CONTRIBUTING.md).
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-dco.sh "$BASE_SHA..$HEAD_SHA"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t chartmate:ci .
