name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # pnpm exactly as pinned in package.json (packageManager): corepack checks its sha512. Node no longer bundles
      # corepack: install-corepack.sh installs the release it pins (version and sha512).
      - name: pnpm (corepack)
        shell: bash
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          set -euo pipefail
          bash .github/scripts/install-corepack.sh
          corepack enable pnpm
          want="$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")"
          got="$(pnpm --version)"
          if [ "$got" != "$want" ]; then
            echo "::error title=pnpm version::pnpm $got, but package.json pins $want"
            exit 1
          fi
      # The pnpm store is cached here only (pull requests and main), never in the release workflows.
      - name: pnpm store path
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      # Dependency install scripts never run (see desktop.yml for why nothing needs them).
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Any known vulnerability in any dependency (prod or dev, shipped or build-time) fails the build.
      - run: pnpm audit
      - run: pnpm typecheck
      # Includes the desktop unit/security tests and the server suites re-run on the node:sqlite dialect.
      - run: pnpm test
      # Every shipped dependency (server image, desktop app) has an AGPL-3.0-compatible license and a license text.
      - run: pnpm licenses:check
      # `pnpm new:indicator` must keep producing an indicator that typechecks and passes its own and the catalog tests.
      - name: Indicator scaffold
        run: |
          pnpm new:indicator CiScaffoldCheck
          pnpm --filter @chartmate/web typecheck
          pnpm --filter @chartmate/web exec vitest run test/indicators
          rm apps/web/src/chart/indicators/custom/ciScaffoldCheck.ts apps/web/test/indicators/ciScaffoldCheck.test.ts
      - run: pnpm --filter @chartmate/web build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # The server's DB-backed suites (repos, market, baskets, routes, HTTP) again on Postgres. The image is the one
  # compose.yaml pins (a test keeps them equal); each test file gets its own schema, files run one at a time.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_USER: chartmate
          POSTGRES_PASSWORD: chartmate-ci
          POSTGRES_DB: chartmate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chartmate -d chartmate"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: pnpm (corepack)
        shell: bash
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          set -euo pipefail
          bash .github/scripts/install-corepack.sh
          corepack enable pnpm
          want="$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")"
          got="$(pnpm --version)"
          if [ "$got" != "$want" ]; then
            echo "::error title=pnpm version::pnpm $got, but package.json pins $want"
            exit 1
          fi
      - name: pnpm store path
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Server DB suites on Postgres
        env:
          TEST_PG_URL: postgres://chartmate:chartmate-ci@localhost:5432/chartmate
          CHARTMATE_TEST_DB: postgres
        run: pnpm --filter @chartmate/server exec vitest run --no-file-parallelism test/db test/market test/baskets test/routes test/http

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t chartmate:ci .
