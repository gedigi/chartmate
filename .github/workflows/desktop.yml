name: Desktop

# Desktop app (Chartmate) for macOS (arm64 + x64: dmg + zip) and Windows (x64 + arm64: NSIS installer + zip).
#
# Job layout (least privilege):
#   test         — pnpm audit, typecheck, tests; no secrets, read-only token.
#   package-mac  — build/sign/notarize on macOS (the app, then each dmg: notarytool + stapler, checked with spctl);
#                  Apple secrets exist ONLY in the env of the packaging step.
#   package-win  — build/sign on Windows; Azure/Certum/WIN_CSC secrets exist ONLY in the env of the packaging step.
#                  Certum (SimplySign) login secrets are passed only on tag builds (each signature counts against
#                  the certificate's monthly quota, and the TOTP seed is a long-lived credential).
#   release      — tags only: creates the GitHub Release for the tag (notes: the tag's CHANGELOG.md section, then
#                  the signing table) and attaches the artifacts (contents: write).
# Builds without signing secrets are unsigned (allowed); unsigned builds contain no auto-updater at all.
# The repository is never hardcoded: everything uses github.repository / GITHUB_REPOSITORY.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The tag, the desktop app's version and the release must agree; fail before anything slow runs.
      - name: Tag matches the desktop version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error title=Tag does not match the version::tag $GITHUB_REF_NAME, apps/desktop/package.json $version"
            exit 1
          fi
      # No dependency install scripts run. Nothing here needs them: esbuild resolves its platform binary package,
      # better-sqlite3 ships prebuilds, the Electron binary is not needed for tests, and electron-builder
      # downloads its own Electron distribution when packaging.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # A release never ships with a known vulnerability in any dependency (prod or dev).
      - run: pnpm audit
      - run: pnpm typecheck
      - run: pnpm test

  package-mac:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      signing: ${{ steps.package.outputs.signing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @chartmate/web build
      - name: Bundle, package, sign, notarize (macOS)
        id: package
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # app-update.yml (owner/repo from GITHUB_REPOSITORY); only used by signed builds.
          CHARTMATE_PUBLISH: github
        run: |
          set -euo pipefail
          node scripts/bundle.mjs --platform=darwin
          pnpm exec electron-builder --config electron-builder.config.cjs --mac --publish never
          # electron-builder notarizes and staples the app; the dmg (signed by electron-builder, dmg.sign) is
          # notarized and stapled here, so Gatekeeper also accepts the download itself.
          if [ "$(node -p "require('./build/signing.cjs').signingFor(process.env, 'darwin').notarize")" = true ]; then
            for dmg in release/*.dmg; do
              out="$(xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait --timeout 30m --output-format json)" || true
              id="$(node -e 'try { process.stdout.write(String(JSON.parse(process.argv[1]).id ?? "")) } catch {}' "$out")"
              status="$(node -e 'try { process.stdout.write(String(JSON.parse(process.argv[1]).status ?? "")) } catch {}' "$out")"
              if [ "$status" != Accepted ]; then
                echo "::error title=dmg notarization failed::$dmg: ${status:-no result}"
                echo "$out"
                if [ -n "$id" ]; then
                  xcrun notarytool log "$id" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" || true
                fi
                exit 1
              fi
              xcrun stapler staple "$dmg"
              xcrun stapler validate "$dmg"
              spctl -a -t open --context context:primary-signature -v "$dmg"
            done
          fi
          echo "signing=$(node -p "require('./build/signing.cjs').signingFor(process.env, 'darwin').method")" >> "$GITHUB_OUTPUT"
      - name: Smoke test (shipped arm64 app + TEST-ONLY inspectable copy)
        working-directory: apps/desktop
        env:
          SIGNING: ${{ steps.package.outputs.signing }}
        run: |
          node smoke/prepare-inspectable.mjs release/mac-arm64/Chartmate.app release/test-only
          if [ "$SIGNING" = unsigned ]; then export SMOKE_EXPECT_UNSIGNED=1; else export SMOKE_EXPECT_UNSIGNED=0; fi
          SMOKE_APP="$PWD/release/test-only/Chartmate TEST-ONLY.app" SMOKE_HARDENED_APP="$PWD/release/mac-arm64/Chartmate.app" pnpm smoke
      - name: Artifact sizes
        run: ls -la apps/desktop/release | grep -E '\.(dmg|zip)$'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-macos
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  package-win:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 120
    # Tag pushes run in the `windows-signing` environment, which alone holds the Certum secrets (restricted to v*
    # tags, optionally with a required reviewer). Other runs use no environment and build unsigned.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'windows-signing' || '' }}
    outputs:
      signing: ${{ steps.package.outputs.signing }}
      sign_failed: ${{ steps.package.outputs.sign_failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @chartmate/web build
        timeout-minutes: 10
      - name: Bundle, package, sign (Windows)
        id: package
        # The hosted Windows runner is slow at extracting and zipping the two Electron distributions
        # (observed 19-25 minutes for x64 + arm64); a failed Certum signing rebuilds once, unsigned.
        timeout-minutes: 80
        working-directory: apps/desktop
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # Certum SimplySign cloud certificate (scripts/certum/login.ps1 + build/win-sign.cjs).
          CHARTMATE_CERTUM_USERNAME: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.CHARTMATE_CERTUM_USERNAME || '' }}
          CHARTMATE_CERTUM_OTP_URI: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.CHARTMATE_CERTUM_OTP_URI || '' }}
          CHARTMATE_WIN_PUBLISHER_NAME: ${{ vars.CHARTMATE_WIN_PUBLISHER_NAME }}
          CHARTMATE_CERTUM_SIMPLYSIGN_VERSION: ${{ vars.CHARTMATE_CERTUM_SIMPLYSIGN_VERSION }}
          CHARTMATE_CERTUM_SIMPLYSIGN_MSI_SHA256: ${{ vars.CHARTMATE_CERTUM_SIMPLYSIGN_MSI_SHA256 }}
          CHARTMATE_CERTUM_SIMPLYSIGN_SIGNER_SHA1: ${{ vars.CHARTMATE_CERTUM_SIMPLYSIGN_SIGNER_SHA1 }}
          CHARTMATE_CERTUM_TOTP_ALGORITHM: ${{ vars.CHARTMATE_CERTUM_TOTP_ALGORITHM }}
          CHARTMATE_PUBLISH: github
        run: |
          set -euo pipefail
          sign_failed=false
          if [ "$(node -p "require('./build/signing.cjs').signingFor(process.env, 'win32').certum")" = ci-login ]; then
            if pwsh -NoProfile -NonInteractive -File scripts/certum/login.ps1 -OutFile "$RUNNER_TEMP/certum-thumbprint"; then
              CHARTMATE_WIN_CERT_SHA1="$(cat "$RUNNER_TEMP/certum-thumbprint")"
              export CHARTMATE_WIN_CERT_SHA1
              export CHARTMATE_WIN_SIGN_LOG="$RUNNER_TEMP/certum-sign-log.jsonl"
            else
              sign_failed=true
            fi
          fi
          # The login secrets end here: bundle.mjs, electron-builder, its dependencies and signtool never see them.
          # With the thumbprint exported, signing.cjs resolves to the signtool backend (publisher + thumbprint).
          unset CHARTMATE_CERTUM_USERNAME CHARTMATE_CERTUM_OTP_URI
          # build: 0 = ok, 3 = the Certum sign hook failed, 2 = signature verification failed, 1 = anything else.
          build() {
            rm -rf release
            node scripts/bundle.mjs --platform=win32 || return 1
            if ! pnpm exec electron-builder --config electron-builder.config.cjs --win --publish never 2>&1 | tee "$RUNNER_TEMP/electron-builder.log"; then
              grep -qE 'Certum signing failed|refusing further attempts' "$RUNNER_TEMP/electron-builder.log" && return 3
              return 1
            fi
            if [ "$(node -p "require('./build/signing.cjs').signingFor(process.env, 'win32').certum")" != null ]; then
              # Every installer, uninstaller and chartmate.exe signed by the publisher and timestamped; latest.yml matches.
              node scripts/verify-win-signatures.mjs release ${CHARTMATE_WIN_SIGN_LOG:+--sign-log="$CHARTMATE_WIN_SIGN_LOG"} || return 2
            fi
          }
          if [ "$sign_failed" = false ]; then
            rc=0
            build || rc=$?
            if [ "$rc" = 2 ]; then
              # Signed, but the result does not check out: never publish it, and never paper over it with a fallback.
              echo "::error title=Windows signature verification failed::see the problems listed above"
              exit 1
            fi
            if [ "$rc" = 3 ]; then sign_failed=true; elif [ "$rc" != 0 ]; then exit 1; fi
          fi
          if [ "$sign_failed" = true ]; then
            # Only the SimplySign login or the sign hook failed: still ship the release (macOS included). Windows is
            # rebuilt without Certum (unsigned unless another method is configured) and the owner signs it afterwards
            # with `pnpm --filter @chartmate/desktop sign:win`.
            echo "::warning title=Windows signing step failed::Certum SimplySign login or signing failed in CI; rebuilding Windows without it. Sign it with sign:win (docs/desktop.md, Windows signing with Certum)."
            unset CHARTMATE_WIN_CERT_SHA1 CHARTMATE_WIN_SIGN_LOG
            build
          fi
          echo "signing=$(node -p "require('./build/signing.cjs').signingFor(process.env, 'win32').method")" >> "$GITHUB_OUTPUT"
          echo "sign_failed=$sign_failed" >> "$GITHUB_OUTPUT"
      - name: Close SimplySign Desktop
        if: always()
        shell: pwsh
        run: Get-Process SimplySignDesktop -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Smoke test (shipped x64 exe + TEST-ONLY inspectable copy)
        timeout-minutes: 15
        working-directory: apps/desktop
        shell: bash
        env:
          SIGNING: ${{ steps.package.outputs.signing }}
        run: |
          EXE="$(node smoke/prepare-inspectable.mjs release/win-unpacked release/test-only | tail -n 1)"
          if [ "$SIGNING" = unsigned ]; then export SMOKE_EXPECT_UNSIGNED=1; else export SMOKE_EXPECT_UNSIGNED=0; fi
          SMOKE_APP="$EXE" SMOKE_HARDENED_APP="$PWD/release/win-unpacked/chartmate.exe" pnpm smoke
      - name: Artifact sizes
        shell: bash
        run: ls -la apps/desktop/release | grep -E '\.(exe|zip)$'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-mac, package-win]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its assets — nothing else
    steps:
      # Only the changelog and its section extractor (before the download: a checkout cleans the workspace).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            CHANGELOG.md
            apps/desktop/scripts/changelog-section.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # The tag's CHANGELOG.md section (empty, with a warning, when there is none: the release still ships). Its own
      # step, without the token: repository code never runs next to GH_TOKEN.
      - name: Changelog section for the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node apps/desktop/scripts/changelog-section.mjs CHANGELOG.md "$TAG" > changes.md
          if [ ! -s changes.md ]; then echo "::warning title=No changelog entry::CHANGELOG.md has no section for ${TAG#v}"; fi
      - name: Create the GitHub Release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          MAC_SIGNING: ${{ needs.package-mac.outputs.signing }}
          WIN_SIGNING: ${{ needs.package-win.outputs.signing }}
          WIN_SIGN_FAILED: ${{ needs.package-win.outputs.sign_failed }}
        run: |
          set -euo pipefail
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac  # v1.2.3 = release, v1.2.3-beta.1 = pre-release
          {
            echo "## Chartmate ${TAG#v}"
            echo
            if [ -s changes.md ]; then
              cat changes.md
              echo
            fi
            echo "| Platform | Code signing |"
            echo "|---|---|"
            echo "| macOS (arm64, x64) | ${MAC_SIGNING} |"
            echo "| Windows (x64, arm64) | ${WIN_SIGNING} |"
            echo
            if [ "$MAC_SIGNING" = unsigned ]; then
              echo "**macOS build is unsigned.** macOS refuses to open it the first time: in **System Settings**, **Privacy & Security**, click **Open Anyway** (macOS 14 and earlier: right-click the app, then **Open**)."
              echo
            fi
            if [ "$WIN_SIGN_FAILED" = true ]; then
              echo "**Windows signing step failed in CI** — sign with \`sign:win\`."
              echo
            fi
            if [ "$WIN_SIGNING" = unsigned ]; then
              echo "**Windows build is unsigned.** SmartScreen warns on first launch: choose **More info**, then **Run anyway**."
              echo
            fi
            if [ "$MAC_SIGNING" = unsigned ] || [ "$WIN_SIGNING" = unsigned ]; then
              echo "Unsigned builds contain no auto-updater: install new versions manually from this page."
            fi
          } > notes.md
          ls -la dist
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Chartmate ${TAG#v}" --notes-file notes.md \
            --verify-tag "${prerelease[@]}" \
            dist/*.dmg dist/*.zip dist/*.exe dist/*.blockmap dist/latest*.yml
