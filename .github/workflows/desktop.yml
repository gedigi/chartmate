name: Desktop

# Desktop app (Chartmate) for macOS (arm64 + x64: dmg + zip) and Windows (x64 + arm64: NSIS installer + zip).
#
# Job layout (least privilege; a job that references a secret is the only place that secret ever reaches):
#   test             — tag on main, tag = version, pnpm audit, typecheck, tests, license gate; no secrets.
#   package-mac      — builds both unsigned .app bundles (no secrets). Whether the release is signed is decided here,
#                      from the CHARTMATE_MAC_SIGN_IDENTITY variable (tags only): a signed build compiles the
#                      auto-updater in.
#   sign-mac         — `macos-signing` environment, fresh runner, no dependency code at all (no package manager, no
#                      Node.js): imports the Developer ID key non-extractable into a temporary keychain, signs the
#                      apps inside-out, notarizes and staples them (.github/scripts/macos-sign.sh).
#   dist-mac         — no secrets: dmg + zip + blockmaps + latest-mac.yml from the (signed) apps with
#                      `electron-builder --prepackaged`, then smoke tests.
#   notarize-mac-dmg — `macos-signing` again, no dependency code: signs, notarizes and staples each dmg.
#   package-win      — Windows build. On tags it runs in the `windows-signing` environment: the Certum (SimplySign)
#                      login comes first, before any dependency code runs on the runner, and the TOTP seed is in no
#                      later step's environment; the logged-in session itself lasts for the build (see
#                      docs/desktop.md, "Residual risk").
#   release          — tags only: creates the GitHub Release (notes: the tag's CHANGELOG.md section, then the signing
#                      table) and attaches the artifacts plus compose.yaml and env.example (contents: write). It is
#                      marked Latest only when no higher full release exists, and it is a draft when Windows signing
#                      failed (published after `sign:win`).
# Builds without signing are unsigned (allowed); unsigned builds contain no auto-updater at all.
# The repository is never hardcoded: everything uses github.repository / GITHUB_REPOSITORY.
# No job here restores a dependency cache, so a poisoned cache entry cannot reach a signed artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # origin/main, for the check below
      # Releases come only from reviewed code: the tagged commit must be on main.
      - name: Tag is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error title=Tag is not on main::$GITHUB_REF_NAME ($GITHUB_SHA) is not an ancestor of origin/main"
            exit 1
          fi
      # A signed 1.0.0 shipped: a tag must not silently fall back to an unsigned macOS build without the updater.
      # CHARTMATE_ALLOW_UNSIGNED_MAC=true is the deliberate opt-out.
      - name: macOS signing plan
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IDENTITY: ${{ vars.CHARTMATE_MAC_SIGN_IDENTITY }}
          ALLOW_UNSIGNED: ${{ vars.CHARTMATE_ALLOW_UNSIGNED_MAC }}
        run: |
          if [ -n "$IDENTITY" ]; then
            echo "macOS: signed as $IDENTITY"
          elif [ "$ALLOW_UNSIGNED" = true ]; then
            echo "::warning title=macOS unsigned::CHARTMATE_MAC_SIGN_IDENTITY is not set; building macOS unsigned (no updater) as CHARTMATE_ALLOW_UNSIGNED_MAC allows"
          else
            echo "::error title=macOS would ship unsigned::set the CHARTMATE_MAC_SIGN_IDENTITY repository variable, or CHARTMATE_ALLOW_UNSIGNED_MAC=true to release macOS unsigned"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The tag, the desktop app's version and the release must agree; fail before anything slow runs.
      - name: Tag matches the desktop version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error title=Tag does not match the version::tag $GITHUB_REF_NAME, apps/desktop/package.json $version"
            exit 1
          fi
      # pnpm exactly as pinned in package.json (packageManager): corepack checks its sha512.
      - name: pnpm (corepack)
        shell: bash
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          set -euo pipefail
          corepack enable pnpm
          want="$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")"
          got="$(pnpm --version)"
          if [ "$got" != "$want" ]; then
            echo "::error title=pnpm version::pnpm $got, but package.json pins $want"
            exit 1
          fi
      # No dependency install scripts run. Nothing here needs them: esbuild resolves its platform binary package,
      # better-sqlite3 ships prebuilds, the Electron binary is not needed for tests, and electron-builder
      # downloads its own Electron distribution when packaging.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # A release never ships with a known vulnerability in any dependency (prod or dev).
      - run: pnpm audit
      - run: pnpm typecheck
      - run: pnpm test
      # Every shipped dependency has an AGPL-3.0-compatible license and a license text for the notices.
      - run: pnpm licenses:check

  package-mac:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: pnpm (corepack)
        shell: bash
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          set -euo pipefail
          corepack enable pnpm
          want="$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")"
          got="$(pnpm --version)"
          if [ "$got" != "$want" ]; then
            echo "::error title=pnpm version::pnpm $got, but package.json pins $want"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @chartmate/web build
      - name: Bundle and package the apps (unsigned)
        working-directory: apps/desktop
        env:
          # Tag builds are signed when the repository variable names the Developer ID identity (not a secret; the key
          # and the Apple credentials stay in the macos-signing environment). Every job decides from the same
          # expression, never from an output of a job that ran dependency code.
          SIGN: ${{ startsWith(github.ref, 'refs/tags/v') && vars.CHARTMATE_MAC_SIGN_IDENTITY != '' }}
          IDENTITY: ${{ startsWith(github.ref, 'refs/tags/v') && vars.CHARTMATE_MAC_SIGN_IDENTITY || '' }}
          # app-update.yml (owner/repo from GITHUB_REPOSITORY); only used by signed builds.
          CHARTMATE_PUBLISH: github
        run: |
          set -euo pipefail
          # A build that will be signed compiles the auto-updater in (build/signing.cjs counts CSC_NAME as signed).
          # Only bundle.mjs sees the name: electron-builder gets no identity, so it signs nothing.
          if [ "$SIGN" = true ]; then
            CSC_NAME="$IDENTITY" node scripts/bundle.mjs --platform=darwin
          else
            node scripts/bundle.mjs --platform=darwin
          fi
          # The zip target makes electron-builder write app-update.yml into the apps; the zips themselves are
          # discarded (dist-mac builds the shipped ones from the signed apps).
          pnpm exec electron-builder --config electron-builder.config.cjs --mac zip --x64 --arm64 --publish never
          tar -C release -cf "$RUNNER_TEMP/mac-apps.tar" mac/Chartmate.app mac-arm64/Chartmate.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-apps
          path: ${{ runner.temp }}/mac-apps.tar
          if-no-files-found: error
          retention-days: 1

  sign-mac:
    needs: package-mac
    if: startsWith(github.ref, 'refs/tags/v') && vars.CHARTMATE_MAC_SIGN_IDENTITY != ''
    runs-on: macos-latest
    timeout-minutes: 60
    # Holds CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID (v* tags only).
    environment: macos-signing
    outputs:
      method: ${{ steps.method.outputs.method }}
    steps:
      # Only the signing script and the entitlements: no dependency code exists on this runner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /.github/scripts/macos-sign.sh
            /apps/desktop/build/entitlements.mac.plist
            /apps/desktop/build/entitlements.mac.inherit.plist
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-apps
          path: ${{ runner.temp }}/in
      - name: Unpack
        run: mkdir -p "$RUNNER_TEMP/apps" && tar -C "$RUNNER_TEMP/apps" -xf "$RUNNER_TEMP/in/mac-apps.tar"
      - name: Import the Developer ID certificate (temporary keychain, key not extractable)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          IDENTITY: ${{ vars.CHARTMATE_MAC_SIGN_IDENTITY }}
        run: .github/scripts/macos-sign.sh import
      - name: Notarization credentials (keychain profile)
        id: notary
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: .github/scripts/macos-sign.sh store-notary >> "$GITHUB_OUTPUT"
      - name: Sign the apps
        env:
          IDENTITY: ${{ vars.CHARTMATE_MAC_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          for app in "$RUNNER_TEMP/apps/mac/Chartmate.app" "$RUNNER_TEMP/apps/mac-arm64/Chartmate.app"; do
            .github/scripts/macos-sign.sh sign-app "$app" apps/desktop/build/entitlements.mac.plist apps/desktop/build/entitlements.mac.inherit.plist
          done
      - name: Notarize and staple the apps
        if: steps.notary.outputs.notarize == 'true'
        run: |
          set -euo pipefail
          for app in "$RUNNER_TEMP/apps/mac/Chartmate.app" "$RUNNER_TEMP/apps/mac-arm64/Chartmate.app"; do
            .github/scripts/macos-sign.sh notarize "$app"
          done
      - name: Signing method
        id: method
        env:
          NOTARIZE: ${{ steps.notary.outputs.notarize }}
        run: |
          if [ "$NOTARIZE" = true ]; then echo "method=Developer ID + notarized"; else echo "method=Developer ID"; fi >> "$GITHUB_OUTPUT"
      - name: Pack the signed apps
        run: tar -C "$RUNNER_TEMP/apps" -cf "$RUNNER_TEMP/mac-apps-signed.tar" mac/Chartmate.app mac-arm64/Chartmate.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-apps-signed
          path: ${{ runner.temp }}/mac-apps-signed.tar
          if-no-files-found: error
          retention-days: 1
      - name: Delete the keychain
        if: always()
        run: .github/scripts/macos-sign.sh cleanup

  dist-mac:
    needs: [package-mac, sign-mac]
    # Runs after sign-mac, or without it for an unsigned build; never after a failed signing run.
    if: ${{ !cancelled() && needs.package-mac.result == 'success' && (needs.sign-mac.result == 'success' || (needs.sign-mac.result == 'skipped' && !(startsWith(github.ref, 'refs/tags/v') && vars.CHARTMATE_MAC_SIGN_IDENTITY != ''))) }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: pnpm (corepack)
        shell: bash
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          set -euo pipefail
          corepack enable pnpm
          want="$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")"
          got="$(pnpm --version)"
          if [ "$got" != "$want" ]; then
            echo "::error title=pnpm version::pnpm $got, but package.json pins $want"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ (startsWith(github.ref, 'refs/tags/v') && vars.CHARTMATE_MAC_SIGN_IDENTITY != '') && 'mac-apps-signed' || 'mac-apps' }}
          path: ${{ runner.temp }}/in
      - name: Package dmg and zip from the apps (prepackaged, signs nothing)
        working-directory: apps/desktop
        env:
          CHARTMATE_PUBLISH: github
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apps" && tar -C "$RUNNER_TEMP/apps" -xf "$RUNNER_TEMP/in/"*.tar
          # A prepackaged build takes one .app, so one run per architecture (targets and arch on the command line:
          # the config's arch list would otherwise package this one app as both), each into a clean release/.
          mkdir -p "$RUNNER_TEMP/out"
          for arch in x64 arm64; do
            dir=mac; if [ "$arch" = arm64 ]; then dir=mac-arm64; fi
            rm -rf release
            pnpm exec electron-builder --config electron-builder.config.cjs --mac dmg zip "--$arch" \
              --prepackaged "$RUNNER_TEMP/apps/$dir/Chartmate.app" --publish never
            mv release/latest-mac.yml "$RUNNER_TEMP/latest-mac-$arch.yml"
            mv release/*.dmg release/*.zip release/*.blockmap "$RUNNER_TEMP/out/"
          done
          rm -rf release && mv "$RUNNER_TEMP/out" release
          # One latest-mac.yml listing both zips (sha512 and size of the files in release/).
          node scripts/merge-update-info.mjs "$RUNNER_TEMP/latest-mac-x64.yml" "$RUNNER_TEMP/latest-mac-arm64.yml" > release/latest-mac.yml
          cat release/latest-mac.yml
      - name: Smoke test (shipped arm64 app + TEST-ONLY inspectable copy)
        working-directory: apps/desktop
        env:
          SIGNING: ${{ needs.sign-mac.outputs.method || 'unsigned' }}
        run: |
          app="$RUNNER_TEMP/apps/mac-arm64/Chartmate.app"
          if [ "$SIGNING" = unsigned ]; then export SMOKE_EXPECT_UNSIGNED=1; else export SMOKE_EXPECT_UNSIGNED=0; fi
          if [ "$SMOKE_EXPECT_UNSIGNED" = 0 ]; then codesign --verify --deep --strict --verbose=2 "$app"; fi
          node smoke/prepare-inspectable.mjs "$app" release/test-only
          SMOKE_APP="$PWD/release/test-only/Chartmate TEST-ONLY.app" SMOKE_HARDENED_APP="$app" pnpm smoke
      - name: Artifact sizes
        run: ls -la apps/desktop/release | grep -E '\.(dmg|zip)$'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-macos
          path: |
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml
          if-no-files-found: error
          retention-days: 14
      # Unsigned: the dmgs ship as they are. Signed: notarize-mac-dmg signs and notarizes them first.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ (startsWith(github.ref, 'refs/tags/v') && vars.CHARTMATE_MAC_SIGN_IDENTITY != '') && 'mac-dmg-unsigned' || 'desktop-macos-dmg' }}
          path: apps/desktop/release/*.dmg
          if-no-files-found: error
          retention-days: 14

  notarize-mac-dmg:
    needs: [package-mac, sign-mac, dist-mac]
    if: startsWith(github.ref, 'refs/tags/v') && vars.CHARTMATE_MAC_SIGN_IDENTITY != ''
    runs-on: macos-latest
    timeout-minutes: 60
    environment: macos-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /.github/scripts/macos-sign.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-dmg-unsigned
          path: ${{ runner.temp }}/dmg
      - name: Import the Developer ID certificate (temporary keychain, key not extractable)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          IDENTITY: ${{ vars.CHARTMATE_MAC_SIGN_IDENTITY }}
        run: .github/scripts/macos-sign.sh import
      - name: Notarization credentials (keychain profile)
        id: notary
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: .github/scripts/macos-sign.sh store-notary >> "$GITHUB_OUTPUT"
      # Signed (Developer ID), then notarized and stapled, so Gatekeeper accepts the download itself
      # (spctl -a -t open --context context:primary-signature).
      - name: Sign, notarize and staple the dmgs
        env:
          IDENTITY: ${{ vars.CHARTMATE_MAC_SIGN_IDENTITY }}
          NOTARIZE: ${{ steps.notary.outputs.notarize }}
        run: |
          set -euo pipefail
          for dmg in "$RUNNER_TEMP"/dmg/*.dmg; do
            .github/scripts/macos-sign.sh sign-dmg "$dmg"
            if [ "$NOTARIZE" = true ]; then .github/scripts/macos-sign.sh notarize "$dmg"; fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-macos-dmg
          path: ${{ runner.temp }}/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Delete the keychain
        if: always()
        run: .github/scripts/macos-sign.sh cleanup

  package-win:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 120
    # Tag pushes run in the `windows-signing` environment, which alone holds the Certum secrets (restricted to v*
    # tags, optionally with a required reviewer). Other runs use no environment and build unsigned.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'windows-signing' || '' }}
    outputs:
      signing: ${{ steps.package.outputs.signing }}
      sign_failed: ${{ steps.package.outputs.sign_failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Certum SimplySign login (scripts/certum/login.ps1), first: no dependency code has run on this runner yet,
      # so nothing can be waiting for the seed, and no later step has it in its environment. Only repository code
      # runs here (signing.cjs, login.ps1, totp.mjs), with Node.js itself.
      - name: Certum SimplySign login
        id: certum
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          CHARTMATE_CERTUM_USERNAME: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.CHARTMATE_CERTUM_USERNAME || '' }}
          CHARTMATE_CERTUM_OTP_URI: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.CHARTMATE_CERTUM_OTP_URI || '' }}
          CHARTMATE_WIN_PUBLISHER_NAME: ${{ vars.CHARTMATE_WIN_PUBLISHER_NAME }}
          CHARTMATE_CERTUM_SIMPLYSIGN_VERSION: ${{ vars.CHARTMATE_CERTUM_SIMPLYSIGN_VERSION }}
          CHARTMATE_CERTUM_SIMPLYSIGN_MSI_SHA256: ${{ vars.CHARTMATE_CERTUM_SIMPLYSIGN_MSI_SHA256 }}
          CHARTMATE_CERTUM_SIMPLYSIGN_SIGNER_SHA1: ${{ vars.CHARTMATE_CERTUM_SIMPLYSIGN_SIGNER_SHA1 }}
          CHARTMATE_CERTUM_TOTP_ALGORITHM: ${{ vars.CHARTMATE_CERTUM_TOTP_ALGORITHM }}
        run: |
          set -euo pipefail
          # Assigned first, so a setting signing.cjs rejects (half-configured Certum) fails this step under set -e.
          backend="$(node -p "require('./apps/desktop/build/signing.cjs').signingFor(process.env, 'win32').certum")"
          if [ "$backend" != ci-login ]; then
            echo "login_failed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if pwsh -NoProfile -NonInteractive -File apps/desktop/scripts/certum/login.ps1 -OutFile "$RUNNER_TEMP/certum-thumbprint"; then
            echo "thumbprint=$(cat "$RUNNER_TEMP/certum-thumbprint")" >> "$GITHUB_OUTPUT"
            echo "login_failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "login_failed=true" >> "$GITHUB_OUTPUT"
          fi
      # From here on dependency code runs; the login secrets are in no step's environment.
      - name: pnpm (corepack)
        shell: bash
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          set -euo pipefail
          corepack enable pnpm
          want="$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")"
          got="$(pnpm --version)"
          if [ "$got" != "$want" ]; then
            echo "::error title=pnpm version::pnpm $got, but package.json pins $want"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @chartmate/web build
        timeout-minutes: 10
      - name: Bundle, package, sign (Windows)
        id: package
        # The hosted Windows runner is slow at extracting and zipping the two Electron distributions
        # (observed 19-25 minutes for x64 + arm64); a failed Certum signing rebuilds once, unsigned.
        timeout-minutes: 80
        working-directory: apps/desktop
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # The logged-in SimplySign certificate (empty when there was no login or it failed).
          CHARTMATE_WIN_CERT_SHA1: ${{ steps.certum.outputs.thumbprint }}
          CERTUM_LOGIN_FAILED: ${{ steps.certum.outputs.login_failed }}
          CHARTMATE_WIN_PUBLISHER_NAME: ${{ vars.CHARTMATE_WIN_PUBLISHER_NAME }}
          # Full subject DN (at least CN, O, C) the update installer's signature must match; unset = no Windows updates.
          CHARTMATE_WIN_PUBLISHER_DN: ${{ vars.CHARTMATE_WIN_PUBLISHER_DN }}
          CHARTMATE_PUBLISH: github
        run: |
          set -euo pipefail
          sign_failed="${CERTUM_LOGIN_FAILED:-false}"
          if [ -n "${CHARTMATE_WIN_CERT_SHA1:-}" ]; then
            # signing.cjs resolves to the signtool backend (publisher + thumbprint).
            export CHARTMATE_WIN_SIGN_LOG="$RUNNER_TEMP/certum-sign-log.jsonl"
          else
            unset CHARTMATE_WIN_CERT_SHA1
          fi
          # build: 0 = ok, 3 = the Certum sign hook failed, 2 = signature verification failed, 1 = anything else.
          build() {
            rm -rf release
            node scripts/bundle.mjs --platform=win32 || return 1
            if ! pnpm exec electron-builder --config electron-builder.config.cjs --win --publish never 2>&1 | tee "$RUNNER_TEMP/electron-builder.log"; then
              grep -qE 'Certum signing failed|refusing further attempts' "$RUNNER_TEMP/electron-builder.log" && return 3
              return 1
            fi
            backend="$(node -p "require('./build/signing.cjs').signingFor(process.env, 'win32').certum")" || return 1
            if [ "$backend" != null ]; then
              # Every installer, uninstaller and chartmate.exe signed by the publisher and timestamped; latest.yml matches.
              node scripts/verify-win-signatures.mjs release ${CHARTMATE_WIN_SIGN_LOG:+--sign-log="$CHARTMATE_WIN_SIGN_LOG"} || return 2
            fi
          }
          if [ "$sign_failed" = false ]; then
            rc=0
            build || rc=$?
            if [ "$rc" = 2 ]; then
              # Signed, but the result does not check out: never publish it, and never paper over it with a fallback.
              echo "::error title=Windows signature verification failed::see the problems listed above"
              exit 1
            fi
            if [ "$rc" = 3 ]; then sign_failed=true; elif [ "$rc" != 0 ]; then exit 1; fi
          fi
          if [ "$sign_failed" = true ]; then
            # Only the SimplySign login or the sign hook failed: the release is created as a draft (macOS included)
            # with Windows rebuilt without Certum (unsigned unless another method is configured). The owner signs it
            # with `pnpm --filter @chartmate/desktop sign:win`, then publishes the draft.
            echo "::warning title=Windows signing step failed::Certum SimplySign login or signing failed in CI; rebuilding Windows without it. The release stays a draft: sign it with sign:win, then publish it (docs/desktop.md, Windows signing with Certum)."
            unset CHARTMATE_WIN_CERT_SHA1 CHARTMATE_WIN_SIGN_LOG
            build
          fi
          method="$(node -p "require('./build/signing.cjs').signingFor(process.env, 'win32').method")"
          echo "signing=$method" >> "$GITHUB_OUTPUT"
          echo "sign_failed=$sign_failed" >> "$GITHUB_OUTPUT"
      # Ends the certificate session as soon as packaging is done (before the smoke tests run any more code).
      - name: Close SimplySign Desktop
        if: always()
        shell: pwsh
        run: Get-Process SimplySignDesktop -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Smoke test (shipped x64 exe + TEST-ONLY inspectable copy)
        timeout-minutes: 15
        working-directory: apps/desktop
        shell: bash
        env:
          SIGNING: ${{ steps.package.outputs.signing }}
        run: |
          EXE="$(node smoke/prepare-inspectable.mjs release/win-unpacked release/test-only | tail -n 1)"
          if [ "$SIGNING" = unsigned ]; then export SMOKE_EXPECT_UNSIGNED=1; else export SMOKE_EXPECT_UNSIGNED=0; fi
          SMOKE_APP="$EXE" SMOKE_HARDENED_APP="$PWD/release/win-unpacked/chartmate.exe" pnpm smoke
      - name: Artifact sizes
        shell: bash
        run: ls -la apps/desktop/release | grep -E '\.(exe|zip)$'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [package-mac, sign-mac, dist-mac, notarize-mac-dmg, package-win]
    # Every platform built; a signed macOS build also needs its notarized dmgs.
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.dist-mac.result == 'success' && needs.package-win.result == 'success' && (!(startsWith(github.ref, 'refs/tags/v') && vars.CHARTMATE_MAC_SIGN_IDENTITY != '') || needs.notarize-mac-dmg.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its assets — nothing else
    steps:
      # Only the changelog, its section extractor, the release ranking script and the self-hosting files attached to
      # the release (before the download: a checkout cleans the workspace). The tags rank the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-tags: true
          sparse-checkout: |
            CHANGELOG.md
            apps/desktop/scripts/changelog-section.mjs
            /scripts/release-tags.mjs
            /scripts/check-release-assets.mjs
            /compose.yaml
            /.env.example
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-macos
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-macos-dmg
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-windows
          path: dist
      # The tag's CHANGELOG.md section (empty, with a warning, when there is none: the release still ships). Its own
      # step, without the token: repository code never runs next to GH_TOKEN.
      - name: Changelog section for the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node apps/desktop/scripts/changelog-section.mjs CHANGELOG.md "$TAG" > changes.md
          if [ ! -s changes.md ]; then echo "::warning title=No changelog entry::CHANGELOG.md has no section for ${TAG#v}"; fi
      # Latest only when no higher full release exists (a backport never takes it), also without the token.
      - name: Release ranking
        id: rank
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git tag --list 'v*' | node scripts/release-tags.mjs "$TAG" | tee -a "$GITHUB_OUTPUT"
      # Exactly the expected files for this version, and latest*.yml matching them (sha512, size); no token.
      - name: Release assets
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/check-release-assets.mjs dist "${TAG#v}"
      # The tag's compose.yaml and .env.example, so releases/latest/download/compose.yaml always matches the
      # released image. GitHub renames assets that start with a dot, hence env.example.
      - name: Self-hosting files
        run: |
          set -euo pipefail
          cp compose.yaml dist/compose.yaml
          cp .env.example dist/env.example
      - name: Create the GitHub Release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          LATEST: ${{ steps.rank.outputs.latest }}
          MAC_SIGNING: ${{ needs.sign-mac.outputs.method || 'unsigned' }}
          WIN_SIGNING: ${{ needs.package-win.outputs.signing }}
          WIN_SIGN_FAILED: ${{ needs.package-win.outputs.sign_failed }}
        run: |
          set -euo pipefail
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac  # v1.2.3 = release, v1.2.3-beta.1 = pre-release
          # A Windows build whose signing failed is not published: the owner runs sign:win, then publishes the draft.
          # A draft is never marked Latest: the owner chooses that when publishing it.
          draft=()
          latest="$LATEST"
          if [ "$WIN_SIGN_FAILED" = true ]; then draft=(--draft); latest=false; fi
          {
            echo "## Chartmate ${TAG#v}"
            echo
            if [ -s changes.md ]; then
              cat changes.md
              echo
            fi
            echo "| Platform | Code signing |"
            echo "|---|---|"
            echo "| macOS (arm64, x64) | ${MAC_SIGNING} |"
            echo "| Windows (x64, arm64) | ${WIN_SIGNING} |"
            echo
            if [ "$MAC_SIGNING" = unsigned ]; then
              echo "**macOS build is unsigned.** macOS refuses to open it the first time: in **System Settings**, **Privacy & Security**, click **Open Anyway** (macOS 14 and earlier: right-click the app, then **Open**)."
              echo
            fi
            if [ "$WIN_SIGN_FAILED" = true ]; then
              echo "**Windows signing step failed in CI** — sign with \`sign:win\`."
              echo
            fi
            if [ "$WIN_SIGNING" = unsigned ]; then
              echo "**Windows build is unsigned.** SmartScreen warns on first launch: choose **More info**, then **Run anyway**."
              echo
            fi
            if [ "$MAC_SIGNING" = unsigned ] || [ "$WIN_SIGNING" = unsigned ]; then
              echo "Unsigned builds contain no auto-updater: install new versions manually from this page."
            fi
          } > notes.md
          ls -la dist
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Chartmate ${TAG#v}" --notes-file notes.md \
            --verify-tag --latest="$latest" "${prerelease[@]}" "${draft[@]}" \
            dist/*.dmg dist/*.zip dist/*.exe dist/*.blockmap dist/latest*.yml dist/compose.yaml dist/env.example
