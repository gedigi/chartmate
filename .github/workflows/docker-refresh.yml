name: Docker refresh

# Weekly rebuild of the latest release's self-hosting image, so Debian and Node.js security fixes reach :latest
# (and that release's :X.Y.Z, :X.Y and :X) between releases. Same code (the release tag), fresh base image (the
# Dockerfile's tag, pulled and resolved again) and OS updates (the Dockerfile's apt-get upgrade).
#
#   image    — read-only token: checks this is the upstream repository's default branch, finds the latest full
#              release (scripts/release-tags.mjs --latest, from the default branch), checks the tag is on it and
#              matches its desktop app version, then builds the tag for amd64 and arm64 (under QEMU), always
#              pulling, smoke-tests (the tag's own scripts/docker-smoke.sh) and scans each (fixable HIGH/CRITICAL
#              fails, with the default branch's reviewed .trivyignore). Never pushes.
#   publish  — the only job with `packages: write`: one push at a time with docker.yml's publish job (concurrency
#              ghcr-publish). Pushes only if that tag is still the latest release (a release published meanwhile
#              wins), rebuilt and scanned again on the same base digest, with the release path's tags, provenance,
#              SBOM and GitHub build provenance attestation.
# A release whose Dockerfile still pins its base by digest is rebuilt on that same base: only releases built from
# a tagged base image get fresher. A failed scan means a fix needs a release (or a reviewed .trivyignore entry).
on:
  schedule:
    - cron: '23 4 * * 1' # Mondays, 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-refresh
  cancel-in-progress: false

jobs:
  image:
    # Forks skip it (their copy of the schedule is off by default anyway); the guard step below checks again.
    if: github.event.repository.fork != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      private: ${{ steps.guard.outputs.private }}
      base-context: ${{ steps.base.outputs.context }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the tags, and the history to check the release tag against
      - name: Only the upstream repository, only its default branch
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r fork default private < <(gh api "repos/$GITHUB_REPOSITORY" --jq '"\(.fork) \(.default_branch) \(.private)"')
          if [ "$fork" != false ]; then
            echo "::error title=Fork::the image is refreshed only in the upstream repository"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/$default" ]; then
            echo "::error title=Branch::run it from $default, not $GITHUB_REF"
            exit 1
          fi
          echo "private=$private" >> "$GITHUB_OUTPUT"
      - name: Latest release
        id: release
        run: |
          set -euo pipefail
          tag="$(git tag --list 'v*' | node scripts/release-tags.mjs --latest)"
          # Releases come only from reviewed code: the tag must be on the default branch.
          if ! git merge-base --is-ancestor "refs/tags/$tag" HEAD; then
            echo "::error title=Tag is not on the default branch::$tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Refreshing the image of $tag ($(git rev-parse "refs/tags/$tag^{commit}"))" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ steps.release.outputs.tag }}
          path: release
      - name: Check the version
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="$(node -p "require('./release/apps/desktop/package.json').version")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error title=Tag does not match the version::tag $TAG, apps/desktop/package.json $version"
            exit 1
          fi
      - name: Base image
        id: base
        run: .github/scripts/resolve-base-image.sh release/Dockerfile
      - name: Trivy (version and sha256 pinned)
        run: .github/scripts/install-trivy.sh
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (linux/amd64, loaded for the smoke test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: release
          platforms: linux/amd64
          load: true
          push: false
          tags: chartmate:smoke
          build-args: GITHUB_REPOSITORY=${{ github.repository }}
          build-contexts: ${{ steps.base.outputs.context }}
          pull: true
      - name: Smoke test (linux/amd64)
        run: release/scripts/docker-smoke.sh chartmate:smoke --expect-repository "$GITHUB_REPOSITORY"
      - name: Vulnerability scan (linux/amd64)
        run: .github/scripts/scan-image.sh chartmate:smoke
      - name: Build (linux/arm64, loaded for the smoke test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: release
          platforms: linux/arm64
          load: true
          push: false
          tags: chartmate:smoke-arm64
          build-args: GITHUB_REPOSITORY=${{ github.repository }}
          build-contexts: ${{ steps.base.outputs.context }}
          pull: true
      - name: Smoke test (linux/arm64)
        run: release/scripts/docker-smoke.sh chartmate:smoke-arm64 --platform linux/arm64 --expect-repository "$GITHUB_REPOSITORY"
      - name: Vulnerability scan (linux/arm64)
        run: .github/scripts/scan-image.sh chartmate:smoke-arm64

  publish:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    # One push to the registry at a time, across this workflow and docker.yml.
    concurrency:
      group: ghcr-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the tags as they are now
      # A release tagged while this run waited publishes its own image; this one then stands down.
      - name: Still the latest release
        id: rank
        env:
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          set -euo pipefail
          latest="$(git tag --list 'v*' | node scripts/release-tags.mjs --latest)"
          if [ "$latest" != "$TAG" ]; then
            echo "$TAG is no longer the latest release ($latest is): nothing pushed" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "push=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "push=true" >> "$GITHUB_OUTPUT"
          git tag --list 'v*' | node scripts/release-tags.mjs "$TAG" | tee -a "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse "refs/tags/$TAG^{commit}")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.rank.outputs.push == 'true'
        with:
          persist-credentials: false
          ref: refs/tags/${{ needs.image.outputs.tag }}
          path: release
      - name: Image name
        if: steps.rank.outputs.push == 'true'
        # Registry paths must be lowercase; the repository is never hardcoded.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.rank.outputs.push == 'true'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.rank.outputs.push == 'true'
      - name: Trivy (version and sha256 pinned)
        if: steps.rank.outputs.push == 'true'
        run: .github/scripts/install-trivy.sh
      # Nothing is pushed unless both platforms pass the scan. The push below reuses these builds from the builder's
      # cache (same tag, same base digest), so what is pushed is what was scanned.
      - name: Build (linux/amd64, loaded for the scan)
        if: steps.rank.outputs.push == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: release
          platforms: linux/amd64
          load: true
          push: false
          tags: chartmate:scan-amd64
          build-args: GITHUB_REPOSITORY=${{ github.repository }}
          build-contexts: ${{ needs.image.outputs.base-context }}
          pull: true
      - name: Vulnerability scan (linux/amd64)
        if: steps.rank.outputs.push == 'true'
        run: .github/scripts/scan-image.sh chartmate:scan-amd64
      - name: Build (linux/arm64, loaded for the scan)
        if: steps.rank.outputs.push == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: release
          platforms: linux/arm64
          load: true
          push: false
          tags: chartmate:scan-arm64
          build-args: GITHUB_REPOSITORY=${{ github.repository }}
          build-contexts: ${{ needs.image.outputs.base-context }}
          pull: true
      - name: Vulnerability scan (linux/arm64)
        if: steps.rank.outputs.push == 'true'
        run: .github/scripts/scan-image.sh chartmate:scan-arm64
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.rank.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }} # the job token (packages: write), same as secrets.GITHUB_TOKEN
      - name: Tags, labels and annotations
        id: meta
        if: steps.rank.outputs.push == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          # The release's own tags, exactly as docker.yml publishes them (this run is not on the tag's ref, so the
          # version comes from the tag name).
          tags: |
            type=semver,pattern={{version}},value=${{ needs.image.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.image.outputs.tag }},enable=${{ steps.rank.outputs.minor == 'true' }}
            type=semver,pattern={{major}},value=${{ needs.image.outputs.tag }},enable=${{ steps.rank.outputs.major == 'true' }}
            type=raw,value=latest,enable=${{ steps.rank.outputs.latest == 'true' }}
          # The revision is the release tag's commit, not the default branch this workflow runs from.
          labels: |
            org.opencontainers.image.title=Chartmate
            org.opencontainers.image.description=Self-hosted charting app for stocks, crypto and custom baskets (server + web UI)
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.revision=${{ steps.rank.outputs.sha }}
          annotations: |
            org.opencontainers.image.title=Chartmate
            org.opencontainers.image.description=Self-hosted charting app for stocks, crypto and custom baskets (server + web UI)
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.revision=${{ steps.rank.outputs.sha }}
      - name: Build and push (linux/amd64 + linux/arm64)
        id: build
        if: steps.rank.outputs.push == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: GITHUB_REPOSITORY=${{ github.repository }}
          build-contexts: ${{ needs.image.outputs.base-context }}
          pull: true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
      - name: Build provenance attestation (GitHub, Sigstore-signed)
        if: steps.rank.outputs.push == 'true' && needs.image.outputs.private == 'false'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Summary
        if: steps.rank.outputs.push == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "Pushed \`$IMAGE@$DIGEST\` as:"
            printf '%s\n' "$TAGS" | sed 's/.*/- `&`/'
          } >> "$GITHUB_STEP_SUMMARY"
