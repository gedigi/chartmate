name: Docker refresh

# Weekly rebuild of the latest release's self-hosting image, so Debian and Node.js security fixes reach :latest
# (and that release's :X.Y.Z, :X.Y and :X) between releases. Same code (the release tag), fresh base image (the
# Dockerfile's tag, resolved again to a digest docker-library recorded) and OS updates (the Dockerfile's apt-get
# upgrade).
#
#   plan     — read-only token: checks this is the upstream repository's default branch; finds the latest full
#              release (scripts/release-tags.mjs --latest, from the default branch), checks the tag is on it, has a
#              published (not draft, not pre-release) GitHub Release and matches its desktop app version; resolves
#              the tag's base image. Stands down (nothing built, nothing pushed, a line in the summary) when the
#              release is not published or its Dockerfile pins its base by digest (an older release: a rebuild
#              would be the same image).
#   audit    — the tag's `pnpm audit` (its dependencies, prod and dev, against today's advisories).
#   image    — builds the tag for amd64 and arm64 (under QEMU), always pulling, smoke-tests (the tag's own
#              scripts/docker-smoke.sh) and scans each (fixable HIGH/CRITICAL fails, with the default branch's
#              reviewed .trivyignore). Never pushes.
#   publish  — `ghcr` environment, the only job with `packages: write`. Pushes the image by digest only
#              (untagged), scans and smoke-tests that digest, then, if the tag is still the latest release and no
#              docker.yml run is queued or in progress (a release being published wins), points the release's tags
#              at exactly that digest, with the release path's provenance, SBOM and GitHub build provenance
#              attestation.
#   notify   — on any failure: opens (or comments on) the "Weekly Docker image refresh failed" issue
#              (`issues: write`, nothing else). A failed scan means a fix needs a release, or a reviewed
#              .trivyignore entry.
on:
  schedule:
    - cron: '23 4 * * 1' # Mondays, 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-refresh
  cancel-in-progress: false

jobs:
  plan:
    # Forks skip it (their copy of the schedule is off by default anyway); the guard step below checks again.
    if: github.event.repository.fork != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      refresh: ${{ steps.base.outputs.context != '' && steps.release.outputs.published == 'true' }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      private: ${{ steps.guard.outputs.private }}
      base-context: ${{ steps.base.outputs.context }}
      base-image: ${{ steps.base.outputs.image }}
      base-digest: ${{ steps.base.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the tags, and the history to check the release tag against
      - name: Only the upstream repository, only its default branch
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r fork default private < <(gh api "repos/$GITHUB_REPOSITORY" --jq '"\(.fork) \(.default_branch) \(.private)"')
          if [ "$fork" != false ]; then
            echo "::error title=Fork::the image is refreshed only in the upstream repository"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/$default" ]; then
            echo "::error title=Branch::run it from $default, not $GITHUB_REF"
            exit 1
          fi
          echo "private=$private" >> "$GITHUB_OUTPUT"
      - name: Latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(git tag --list 'v*' | node scripts/release-tags.mjs --latest)"
          # Releases come only from reviewed code: the tag must be on the default branch.
          if ! git merge-base --is-ancestor "refs/tags/$tag" HEAD; then
            echo "::error title=Tag is not on the default branch::$tag"
            exit 1
          fi
          sha="$(git rev-parse "refs/tags/$tag^{commit}")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # Only a published release is republished: never a draft (e.g. waiting for sign:win) or a pre-release.
          # A 404 (no release, or a draft, which this endpoint does not show) stands down; any other error fails.
          if state="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '"\(.draft) \(.prerelease)"' 2>"$RUNNER_TEMP/release.err")"; then
            :
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/release.err"; then
            state=missing
          else
            cat "$RUNNER_TEMP/release.err" >&2
            echo "::error title=GitHub API::could not read the release for $tag"
            exit 1
          fi
          if [ "$state" = "false false" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Refreshing the image of $tag ($sha)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Nothing refreshed: $tag has no published GitHub Release (draft, pre-release or missing: $state)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.release.outputs.published == 'true'
        with:
          persist-credentials: false
          ref: refs/tags/${{ steps.release.outputs.tag }}
          path: release
      - name: Check the version
        if: steps.release.outputs.published == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="$(node -p "require('./release/apps/desktop/package.json').version")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error title=Tag does not match the version::tag $TAG, apps/desktop/package.json $version"
            exit 1
          fi
      - name: Base image
        if: steps.release.outputs.published == 'true'
        id: base
        env:
          GH_TOKEN: ${{ github.token }} # reads docker-library/repo-info (public) through the GitHub API
        run: |
          set -euo pipefail
          .github/scripts/resolve-base-image.sh release/Dockerfile
          # An empty context: the release's Dockerfile pins its base by digest, so a rebuild changes nothing.
          if ! grep -qE '^context=.+' "$GITHUB_OUTPUT"; then
            echo "Nothing refreshed: the release's Dockerfile pins its base image by digest (a rebuild would be the same image)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # Dependabot reads only FROM lines, so the Dockerfile's `# syntax=` frontend digest is bumped by hand: say when
      # docker/dockerfile:1 has moved past the pin. Information only.
      - name: Dockerfile frontend pin
        continue-on-error: true
        run: |
          set -euo pipefail
          pinned="$(sed -n '1s/^# syntax=docker\/dockerfile:1@\(sha256:[0-9a-f]\{64\}\)$/\1/p' Dockerfile)"
          current="$(docker buildx imagetools inspect docker/dockerfile:1 --format '{{json .Manifest}}' | jq -r '.digest // empty')"
          if [ -n "$pinned" ] && [ -n "$current" ] && [ "$pinned" != "$current" ]; then
            msg="docker/dockerfile:1 is now $current; the Dockerfile pins $pinned (bump it by hand, CONTRIBUTING.md)"
            echo "::warning title=Dockerfile frontend::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

  audit:
    needs: plan
    if: needs.plan.outputs.refresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The release tag itself: its lockfile, and its own install-pnpm.sh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ needs.plan.outputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: pnpm (corepack)
        shell: bash
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          set -euo pipefail
          bash .github/scripts/install-pnpm.sh
          want="$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")"
          got="$(pnpm --version)"
          if [ "$got" != "$want" ]; then
            echo "::error title=pnpm version::pnpm $got, but package.json pins $want"
            exit 1
          fi
      # The release's dependencies against today's advisories (prod and dev, as the release itself was checked).
      - run: pnpm audit

  image:
    needs: [plan, audit]
    if: needs.plan.outputs.refresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ needs.plan.outputs.tag }}
          path: release
      - name: Trivy (version and sha256 pinned)
        run: .github/scripts/install-trivy.sh
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (linux/amd64, loaded for the smoke test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: release
          platforms: linux/amd64
          load: true
          push: false
          tags: chartmate:smoke
          build-args: |
            GITHUB_REPOSITORY=${{ github.repository }}
            GITHUB_REF_TYPE=tag
            GITHUB_REF_NAME=${{ needs.plan.outputs.tag }}
            GITHUB_SHA=${{ needs.plan.outputs.sha }}
          build-contexts: ${{ needs.plan.outputs.base-context }}
          pull: true
      # The tag's own smoke test, with --expect-repository only when that version of the script knows it.
      - name: Smoke test (linux/amd64)
        run: |
          set -euo pipefail
          args=()
          if grep -q -- '--expect-repository' release/scripts/docker-smoke.sh; then args=(--expect-repository "$GITHUB_REPOSITORY"); fi
          release/scripts/docker-smoke.sh chartmate:smoke ${args[@]+"${args[@]}"}
      - name: Vulnerability scan (linux/amd64)
        run: .github/scripts/scan-image.sh chartmate:smoke
      - name: Build (linux/arm64, loaded for the smoke test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: release
          platforms: linux/arm64
          load: true
          push: false
          tags: chartmate:smoke-arm64
          build-args: |
            GITHUB_REPOSITORY=${{ github.repository }}
            GITHUB_REF_TYPE=tag
            GITHUB_REF_NAME=${{ needs.plan.outputs.tag }}
            GITHUB_SHA=${{ needs.plan.outputs.sha }}
          build-contexts: ${{ needs.plan.outputs.base-context }}
          pull: true
      - name: Smoke test (linux/arm64)
        run: |
          set -euo pipefail
          args=()
          if grep -q -- '--expect-repository' release/scripts/docker-smoke.sh; then args=(--expect-repository "$GITHUB_REPOSITORY"); fi
          release/scripts/docker-smoke.sh chartmate:smoke-arm64 --platform linux/arm64 ${args[@]+"${args[@]}"}
      - name: Vulnerability scan (linux/arm64)
        run: .github/scripts/scan-image.sh chartmate:smoke-arm64

  publish:
    needs: [plan, image]
    if: needs.plan.outputs.refresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Deployment environment: the repository settings limit `ghcr` to the main branch and v* tags (owner setting).
    environment: ghcr
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      actions: read # to see whether a docker.yml run (a release being published) is queued or in progress
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the tags
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ needs.plan.outputs.tag }}
          path: release
      - name: Floating tags
        id: rank
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          git tag --list 'v*' | node scripts/release-tags.mjs "$TAG" | tee -a "$GITHUB_OUTPUT"
      - name: Image name
        # Registry paths must be lowercase; the repository is never hardcoded.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Trivy (version and sha256 pinned)
        run: .github/scripts/install-trivy.sh
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }} # the job token (packages: write), same as secrets.GITHUB_TOKEN
      - name: Tags, labels and annotations
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          # The release's own tags, exactly as docker.yml publishes them (this run is not on the tag's ref, so the
          # version comes from the tag name).
          tags: |
            type=semver,pattern={{version}},value=${{ needs.plan.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.plan.outputs.tag }},enable=${{ steps.rank.outputs.minor == 'true' }}
            type=semver,pattern={{major}},value=${{ needs.plan.outputs.tag }},enable=${{ steps.rank.outputs.major == 'true' }}
            type=raw,value=latest,enable=${{ steps.rank.outputs.latest == 'true' }}
          # The revision is the release tag's commit, not the default branch this workflow runs from.
          labels: |
            org.opencontainers.image.title=Chartmate
            org.opencontainers.image.description=Self-hosted charting app for stocks, crypto and custom baskets (server + web UI)
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
            org.opencontainers.image.base.name=docker.io/library/${{ needs.plan.outputs.base-image }}
            org.opencontainers.image.base.digest=${{ needs.plan.outputs.base-digest }}
          annotations: |
            org.opencontainers.image.title=Chartmate
            org.opencontainers.image.description=Self-hosted charting app for stocks, crypto and custom baskets (server + web UI)
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
            org.opencontainers.image.base.name=docker.io/library/${{ needs.plan.outputs.base-image }}
            org.opencontainers.image.base.digest=${{ needs.plan.outputs.base-digest }}
      # Pushed by digest only: no tag points at it until it has passed the scan and the smoke tests below.
      - name: Build and push by digest (linux/amd64 + linux/arm64, untagged)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: release
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            GITHUB_REPOSITORY=${{ github.repository }}
            GITHUB_REF_TYPE=tag
            GITHUB_REF_NAME=${{ needs.plan.outputs.tag }}
            GITHUB_SHA=${{ needs.plan.outputs.sha }}
          build-contexts: ${{ needs.plan.outputs.base-context }}
          pull: true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
      - name: Pushed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no image digest from the build"; exit 1; }
          echo "REF=$IMAGE@$DIGEST" >> "$GITHUB_ENV"
      - name: Vulnerability scan (linux/amd64, the pushed digest)
        run: .github/scripts/scan-image.sh "$REF" --platform linux/amd64 --remote
      - name: Vulnerability scan (linux/arm64, the pushed digest)
        run: .github/scripts/scan-image.sh "$REF" --platform linux/arm64 --remote
      - name: Smoke test (both platforms, the pushed digest)
        run: |
          set -euo pipefail
          args=()
          if grep -q -- '--expect-repository' release/scripts/docker-smoke.sh; then args=(--expect-repository "$GITHUB_REPOSITORY"); fi
          # Each platform's image of the pushed digest (Docker's image store pulls one platform per index digest).
          for p in linux/amd64 linux/arm64; do
            img="$(.github/scripts/platform-digest.sh "$REF" "$p")"
            release/scripts/docker-smoke.sh "$img" --platform "$p" ${args[@]+"${args[@]}"}
          done
      # Right before the tags move: still the latest published release, and no release publish queued or running
      # (docker.yml's own image wins). Otherwise this run stands down; the untagged digest stays unreferenced.
      - name: Still the latest release, and no release being published
        id: still
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          latest="$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name' | node scripts/release-tags.mjs --latest)"
          busy="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow docker.yml --event push --limit 50 --json status --jq '[.[] | select(.status != "completed")] | length')"
          if state="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '"\(.draft) \(.prerelease)"' 2>"$RUNNER_TEMP/release.err")"; then
            :
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/release.err"; then
            state=missing
          else
            cat "$RUNNER_TEMP/release.err" >&2
            echo "::error title=GitHub API::could not read the release for $TAG"
            exit 1
          fi
          if [ "$latest" != "$TAG" ]; then
            reason="$TAG is no longer the latest release ($latest is)"
          elif [ "$busy" != 0 ]; then
            reason="a docker.yml release run (tag push) is queued or in progress ($busy)"
          elif [ "$state" != "false false" ]; then
            reason="$TAG has no published GitHub Release any more ($state)"
          else
            echo "tag=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=false" >> "$GITHUB_OUTPUT"
          echo "Nothing tagged: $reason" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Tag the checked digest
        if: steps.still.outputs.tag == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(printf '%s\n' "$TAGS" | sed '/^$/d')
          .github/scripts/tag-image.sh "$REF" "${tags[@]}"
          {
            echo "Pushed \`$REF\` as:"
            printf '%s\n' "${tags[@]}" | sed 's/.*/- `&`/'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build provenance attestation (GitHub, Sigstore-signed)
        if: steps.still.outputs.tag == 'true' && needs.plan.outputs.private == 'false'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  notify:
    needs: [plan, audit, image, publish]
    if: failure() && github.event.repository.fork != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Weekly Docker image refresh failed"
          body="The weekly rebuild of the latest release's image failed: $RUN_URL

          Usually a fixable vulnerability (update the dependency or the base image and release, or add a reviewed
          .trivyignore entry), a failed pnpm audit or a failed smoke test. Close this issue once a refresh passes."
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
