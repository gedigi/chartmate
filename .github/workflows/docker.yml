name: Docker

# Self-hosting image: ghcr.io/<owner>/<repo> (from github.repository, lowercased), linux/amd64 + linux/arm64.
#
# Job layout (least privilege):
#   test     — tags/dispatch: pnpm audit, typecheck, tests; read-only token.
#   image    — every run: resolves the base image tag to a digest docker-library recorded, once (logged and in the
#              job summary),
#              builds the image for amd64 and arm64 (under QEMU) on it, always pulling, smoke-tests each (read-only
#              root filesystem, healthcheck, API, web UI, SQLite temp files, clean SIGTERM shutdown), scans each
#              for vulnerabilities (fails on a fixable HIGH/CRITICAL one, OS packages and node_modules alike), and
#              validates compose.yaml. Never pushes.
#   publish  — only on a vX.Y.Z or vX.Y.Z-suffix tag, pushed or dispatched on (release.yml starts this workflow on
#              the tag it creates; a manual dispatch on a branch only builds and tests), in the `ghcr` environment: the only job with `packages: write`. Builds the multi-arch image
#              on the base digest `image` checked, with BuildKit provenance + SBOM attestations, and pushes it by
#              digest only (untagged); scans and smoke-tests that pushed digest on both platforms; only then points
#              the tags at exactly that digest (.github/scripts/tag-image.sh) and adds a Sigstore-signed GitHub build
#              provenance attestation (public repositories only; private ones on non-Enterprise plans cannot create
#              them).
# docker-refresh.yml rebuilds the latest release's image weekly the same way, so OS and Node.js fixes reach
# :latest between releases.
# Tags: X.Y.Z for a vX.Y.Z tag, plus X.Y, X and latest each only when no higher full release exists in that range
# (scripts/release-tags.mjs; a backport never moves them backward); only X.Y.Z-suffix for a pre-release tag.
# The tagged commit must be on main. The publish path uses no dependency cache.
# Pull requests only build (ci.yml also runs a plain docker build on every pull request).
on:
  push:
    # GitHub filter globs; the publish job re-checks ^v\d+\.\d+\.\d+(-.+)?$.
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']
  workflow_dispatch:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - .env.example
      - scripts/docker-smoke.sh
      - .trivyignore
      - .github/scripts/resolve-base-image.sh
      - .github/scripts/install-trivy.sh
      - .github/scripts/scan-image.sh
      - .github/scripts/install-pnpm.sh
      - .github/workflows/docker.yml

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache on the publish path.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # corepack and pnpm, every download hash-checked (install-pnpm.sh): corepack at the version and sha512 the
      # script pins, the pnpm that package.json pins (packageManager, sha512) and its native binary (pnpm-lock.yaml).
      - name: pnpm (corepack)
        shell: bash
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          set -euo pipefail
          bash .github/scripts/install-pnpm.sh
          want="$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")"
          got="$(pnpm --version)"
          if [ "$got" != "$want" ]; then
            echo "::error title=pnpm version::pnpm $got, but package.json pins $want"
            exit 1
          fi
      # No dependency install scripts run (the image build installs the same way).
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # An image never ships with a known vulnerability in any dependency (prod or dev).
      - run: pnpm audit
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm licenses:check

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      base-context: ${{ steps.base.outputs.context }}
      base-image: ${{ steps.base.outputs.image }}
      base-digest: ${{ steps.base.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The base image tag, resolved once: its digest goes to the log and the job summary, and every build of this
      # run (publish included) uses exactly that image.
      - name: Base image
        id: base
        env:
          GH_TOKEN: ${{ github.token }} # reads docker-library/repo-info (public) through the GitHub API
        run: .github/scripts/resolve-base-image.sh
      - name: Trivy (version and sha256 pinned)
        run: .github/scripts/install-trivy.sh
      # Emulation only runs the runtime stage's one small RUN for arm64; the build stage runs natively.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (linux/amd64, loaded for the smoke test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: chartmate:smoke
          build-args: |
            GITHUB_REPOSITORY=${{ github.repository }}
            GITHUB_REF_TYPE=${{ github.ref_type }}
            GITHUB_REF_NAME=${{ github.ref_name }}
            GITHUB_SHA=${{ github.sha }}
          build-contexts: ${{ steps.base.outputs.context }}
          pull: true
      - name: Smoke test (linux/amd64)
        run: scripts/docker-smoke.sh chartmate:smoke --expect-repository "$GITHUB_REPOSITORY"
      - name: Vulnerability scan (linux/amd64)
        run: .github/scripts/scan-image.sh chartmate:smoke
      - name: Validate compose.yaml
        env:
          CHARTMATE_IMAGE: chartmate:smoke
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml --profile postgres config --quiet
      - name: Build (linux/arm64, loaded for the smoke test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: chartmate:smoke-arm64
          build-args: |
            GITHUB_REPOSITORY=${{ github.repository }}
            GITHUB_REF_TYPE=${{ github.ref_type }}
            GITHUB_REF_NAME=${{ github.ref_name }}
            GITHUB_SHA=${{ github.sha }}
          build-contexts: ${{ steps.base.outputs.context }}
          pull: true
      # Runs under QEMU: proves the arm64 better-sqlite3 binary loads and the server works on that platform.
      - name: Smoke test (linux/arm64)
        run: scripts/docker-smoke.sh chartmate:smoke-arm64 --platform linux/arm64 --expect-repository "$GITHUB_REPOSITORY"
      - name: Vulnerability scan (linux/arm64)
        run: .github/scripts/scan-image.sh chartmate:smoke-arm64

  publish:
    needs: [test, image]
    if: github.event_name != 'pull_request' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Deployment environment: the repository settings limit `ghcr` to the main branch and v* tags (owner setting).
    environment: ghcr
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # origin/main and the tags, for the checks below
      - name: Check the tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "::error::not a release tag: $GITHUB_REF_NAME"
            exit 1
          fi
          # Releases come only from reviewed code: the tagged commit must be on main.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error title=Tag is not on main::$GITHUB_REF_NAME ($GITHUB_SHA) is not an ancestor of origin/main"
            exit 1
          fi
          # One version for the desktop app, the image and the tag.
          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error title=Tag does not match the version::tag $GITHUB_REF_NAME, apps/desktop/package.json $version"
            exit 1
          fi
      # :latest, :X.Y and :X move only when no higher full release exists in that range (a backport such as
      # v1.2.5 after v1.3.0 gets :1.2.5 and :1.2, never :1 or :latest).
      - name: Floating tags
        id: rank
        run: |
          set -euo pipefail
          git tag --list 'v*' | node scripts/release-tags.mjs "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"
      - name: Image name
        # Registry paths must be lowercase; the repository is never hardcoded.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Trivy (version and sha256 pinned)
        run: .github/scripts/install-trivy.sh
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }} # the job token (packages: write), same as secrets.GITHUB_TOKEN
      - name: Tags, labels and annotations
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # Annotations on the multi-arch index too, so the registry shows the description and source.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          # Pre-release tags (vX.Y.Z-suffix) only get {{version}}: metadata-action skips X.Y and X for them.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.rank.outputs.minor == 'true' }}
            type=semver,pattern={{major}},enable=${{ steps.rank.outputs.major == 'true' }}
            type=raw,value=latest,enable=${{ steps.rank.outputs.latest == 'true' }}
          # source (the repository URL), revision, version and created come from the GitHub context; the base image
          # (name and the digest checked against docker-library) is recorded too.
          labels: |
            org.opencontainers.image.title=Chartmate
            org.opencontainers.image.description=Self-hosted charting app for stocks, crypto and custom baskets (server + web UI)
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.base.name=docker.io/library/${{ needs.image.outputs.base-image }}
            org.opencontainers.image.base.digest=${{ needs.image.outputs.base-digest }}
          annotations: |
            org.opencontainers.image.title=Chartmate
            org.opencontainers.image.description=Self-hosted charting app for stocks, crypto and custom baskets (server + web UI)
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.base.name=docker.io/library/${{ needs.image.outputs.base-image }}
            org.opencontainers.image.base.digest=${{ needs.image.outputs.base-digest }}
      # Pushed by digest only: no tag points at it until it has passed the scan and the smoke tests below, and the
      # tags then point at exactly this digest (what was checked is what is published).
      - name: Build and push by digest (linux/amd64 + linux/arm64, untagged)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            GITHUB_REPOSITORY=${{ github.repository }}
            GITHUB_REF_TYPE=${{ github.ref_type }}
            GITHUB_REF_NAME=${{ github.ref_name }}
            GITHUB_SHA=${{ github.sha }}
          build-contexts: ${{ needs.image.outputs.base-context }}
          pull: true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # BuildKit attestations stored with the image: SLSA provenance (it records the resolved base image digest)
          # and an SPDX SBOM per platform.
          provenance: mode=max
          sbom: true
      - name: Pushed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no image digest from the build"; exit 1; }
          echo "REF=$IMAGE@$DIGEST" >> "$GITHUB_ENV"
      - name: Vulnerability scan (linux/amd64, the pushed digest)
        run: .github/scripts/scan-image.sh "$REF" --platform linux/amd64 --remote
      - name: Vulnerability scan (linux/arm64, the pushed digest)
        run: .github/scripts/scan-image.sh "$REF" --platform linux/arm64 --remote
      # Each platform's image of the pushed digest (Docker's image store pulls one platform per index digest).
      - name: Smoke test (linux/amd64, the pushed digest)
        run: |
          set -euo pipefail
          img="$(.github/scripts/platform-digest.sh "$REF" linux/amd64)"
          scripts/docker-smoke.sh "$img" --platform linux/amd64 --expect-repository "$GITHUB_REPOSITORY"
      - name: Smoke test (linux/arm64, the pushed digest)
        run: |
          set -euo pipefail
          img="$(.github/scripts/platform-digest.sh "$REF" linux/arm64)"
          scripts/docker-smoke.sh "$img" --platform linux/arm64 --expect-repository "$GITHUB_REPOSITORY"
      - name: Tag the checked digest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(printf '%s\n' "$TAGS" | sed '/^$/d')
          .github/scripts/tag-image.sh "$REF" "${tags[@]}"
      - name: Build provenance attestation (GitHub, Sigstore-signed)
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # Storage records exist only for organization-owned repositories.
          create-storage-record: false
