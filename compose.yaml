# Chartmate, self-hosted. Download this file and run:
#
#   docker compose up -d    # SQLite in the chartmate-data volume, then open http://localhost:8787
#
# No .env is needed. Create one (see .env.example) only to set a password, change the port or use Postgres.
#
# Postgres: the optional `postgres` profile adds a Postgres service; enable it and DATABASE_URL in .env (see
# .env.example), or run `docker compose --profile postgres up -d` with DATABASE_URL set.
#
# Upgrade: docker compose pull && docker compose up -d
name: chartmate

services:
  chartmate:
    # The published image. CHARTMATE_IMAGE overrides it (a pinned version or digest, or your own build).
    image: ${CHARTMATE_IMAGE:-ghcr.io/gedigi/chartmate:latest}
    restart: unless-stopped
    ports:
      # Loopback only by default: put a reverse proxy in front, or set a password first and then
      # CHARTMATE_BIND=0.0.0.0.
      # Ports Docker publishes bypass host firewalls such as ufw.
      - "${CHARTMATE_BIND:-127.0.0.1}:${CHARTMATE_PORT:-8787}:8787"
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:/data/chartmate.db}
      CHARTMATE_PASSWORD: ${CHARTMATE_PASSWORD:-}
      CHARTMATE_SESSION_SECRET: ${CHARTMATE_SESSION_SECRET:-}
      CHARTMATE_TRUST_PROXY: ${CHARTMATE_TRUST_PROXY:-}
      CHARTMATE_ALLOWED_HOSTS: ${CHARTMATE_ALLOWED_HOSTS:-}
      CHARTMATE_PUBLISHED_BIND: ${CHARTMATE_BIND:-127.0.0.1}
      CHARTMATE_PROVIDERS: ${CHARTMATE_PROVIDERS:-live}
      CRYPTO_PROVIDER: ${CRYPTO_PROVIDER:-binance}
      BINANCE_BASE_URL: ${BINANCE_BASE_URL:-}
    volumes:
      - chartmate-data:/data
    # Persistent writes go only to /data; SQLite's temp files (large sorts, VACUUM) to the /tmp tmpfs.
    # The image's own healthcheck (/api/health) applies.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  postgres:
    profiles: [postgres]
    # Pinned by digest; Dependabot (docker-compose ecosystem) keeps it current.
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    restart: unless-stopped
    environment:
      POSTGRES_USER: chartmate
      POSTGRES_DB: chartmate
      # Required for the postgres profile (the postgres image refuses to initialize without one).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chartmate -d chartmate"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  chartmate-data:
  postgres-data:
